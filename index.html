<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Racing Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <h1>🚴 Bike Racing Game</h1>
            <div class="stats">
                <div class="stat">
                    <span class="label">Speed:</span>
                    <span id="speed" class="value">0</span> km/h
                </div>
                <div class="stat">
                    <span class="label">Distance:</span>
                    <span id="distance" class="value">0</span> km
                </div>
                <div class="stat">
                    <span class="label">Score:</span>
                    <span id="score" class="value">0</span>
                </div>
            </div>
        </header>

        <div class="game-area">
            <canvas id="gameCanvas" width="800" height="600"></canvas>
        </div>

        <div class="controls">
            <button id="startBtn" class="btn btn-primary">Start Game</button>
            <button id="pauseBtn" class="btn btn-secondary" disabled>Pause</button>
            <button id="resetBtn" class="btn btn-danger">Reset</button>
        </div>

        <div class="instructions">
            <h3>How to Play:</h3>
            <ul>
                <li><strong>Arrow Keys</strong> or <strong>W/A/S/D</strong>: Move up, left, down, and right</li>
                <li><strong>Space</strong>: Accelerate</li>
                <li><strong>Shift</strong>: Brake</li>
                <li>Avoid obstacles and collect power-ups</li>
                <li>Maximum speed: 200 km/h</li>
            </ul>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
